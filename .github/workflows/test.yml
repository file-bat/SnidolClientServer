# I test del server, a ogni modifica.
#
# Non serve installare niente: il database dei test e' lo SQLite che Node ha gia' dentro.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove
        run: node --test
